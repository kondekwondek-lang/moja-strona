<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lovemixtape</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0a0a0a,#2b003a,#6d1d8f,#ff4fd8);
background-size:400% 400%;
animation:bg 15s ease infinite;
color:white;
min-height:100vh;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

header{
padding:40px 20px;
text-align:center;
}

h1{
font-size:4rem;
letter-spacing:4px;
text-transform:lowercase;
}

.player{
max-width:900px;
margin:20px auto;
background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
padding:25px;
border-radius:25px;
}

.track{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px;
margin:15px 0;
background:rgba(255,255,255,.06);
border-radius:18px;
}

.track button{
background:#ff4fd8;
border:none;
padding:12px 25px;
border-radius:50px;
cursor:pointer;
color:white;
font-weight:bold;
}

.track button:hover{
transform:scale(1.05);
}

#audio{
width:100%;
margin-top:20px;
}

.gallery{
max-width:1200px;
margin:40px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
padding:20px;
}

.gallery img{
width:100%;
height:420px;
object-fit:cover;
border-radius:25px;
box-shadow:0 0 30px rgba(255,79,216,.4);
transition:.3s;
}

.gallery img:hover{
transform:scale(1.03);
}

footer{
text-align:center;
padding:40px;
opacity:.7;
}
</style>
</head>
<body>

<header>
<h1>lovemixtape</h1>
</header>

<div class="player">

<h2>🎵 Playlista</h2>

<div class="track">
<span>wspomnienie</span>
<button onclick="playSong('wspomnienie.wav')">Play</button>

</div>

<div class="track">
<span>loverider</span>
<button onclick="playSong('loverider.wav')">Play</button>

</div>

<div class="track">
<span>intro</span>
<button onclick="playSong('intro.wav')">Play</button>
</div>

<audio id="audio" controls>
</audio>

</div>

<div class="gallery">
<img src="mixtape.png" alt="">
<img src="gupki.png" alt="">
<img src="dwa gupki.png""alt="">
</div>

<footer>
💜 lovemixtape 💜
</footer>

<script>
const player = document.getElementById("audio");

function playSong(song){
player.src = song;
player.play();
}
</script>

</body>
</html>
